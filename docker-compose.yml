services:
  backend-prod:
    container_name: backend-prod
    image: daily-energy-backend:${TAG:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy

  frontend-prod:
    container_name: frontend-prod
    image: daily-energy-frontend:${TAG:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped

  nginx-prod:
    container_name: nginx-prod
    image: nginx:1.28.0-alpine
    command: ["/bin/sh", "/etc/nginx/run.sh"]
    restart: unless-stopped
    environment:
      SERVER_NAME: ${SERVER_NAME:?Set SERVER_NAME in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/prod.conf.template:/etc/nginx/prod.conf.template:ro
      - ./nginx/bootstrap.conf.template:/etc/nginx/bootstrap.conf.template:ro
      - ./nginx/run.sh:/etc/nginx/run.sh:ro
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      backend-prod:
        condition: service_started
      frontend-prod:
        condition: service_started

  certbot:
    container_name: certbot
    image: certbot/certbot:latest
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    environment:
      SERVER_NAME: ${SERVER_NAME:?Set SERVER_NAME in .env}
      CERTBOT_EMAIL: ${CERTBOT_EMAIL:?Set CERTBOT_EMAIL in .env}
    command: >-
      while :; do
        if [ ! -s "/etc/letsencrypt/live/$$SERVER_NAME/fullchain.pem" ]; then
          certbot certonly --webroot -w /var/www/certbot -d "$$SERVER_NAME"
          --email "$$CERTBOT_EMAIL" --agree-tos --non-interactive && sleep 12h || sleep 300;
        else
          certbot renew --webroot -w /var/www/certbot || true;
          sleep 12h;
        fi;
      done
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      nginx-prod:
        condition: service_started

  postgres:
    container_name: postgres
    image: postgres:17.5
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME in .env}
      POSTGRES_USER: ${DB_USERNAME:?Set DB_USERNAME in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
    name: postgres-data
