services:
  backend-dev:
    container_name: backend-dev
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: true
    environment:
      DB_HOST: postgres-dev
      DB_PORT: 5432
      DB_USERNAME: daily_energy
      DB_PASSWORD: daily_energy
      DB_NAME: daily_energy
      ALLOW_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174
    ports:
      - 8080:8080
    restart: unless-stopped
    networks:
      - network
    profiles:
      - dev
      - dev-full
    depends_on:
      postgres-dev:
        condition: service_healthy

  nginx-dev:
    container_name: nginx-dev
    image: nginx:1.28.0-alpine
    restart: unless-stopped
    env_file:
      - path: .env
        required: true
    ports:
      - 443:443
      - 80:80
    networks:
      - network
    configs:
      - source: nginx-config-dev
        target: /etc/nginx/conf.d/default.conf
    depends_on:
      backend-dev:
        restart: false
        required: true
        condition: service_started
    profiles:
      - dev-proxy

  backend-prod:
    container_name: backend-prod
    image: daily-energy-backend:${TAG:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env
        required: true
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
    networks:
      - network
    profiles:
      - prod
    depends_on:
      postgres:
        condition: service_healthy

  nginx-prod:
    container_name: nginx-prod
    image: nginx:1.28.0-alpine
    command: ["/bin/sh", "/etc/nginx/run.sh"]
    restart: unless-stopped
    env_file:
      - path: .env
        required: true
    ports:
      - 443:443
      - 80:80
    networks:
      - network
    volumes:
      - ./nginx/prod.conf.template:/etc/nginx/prod.conf.template:ro
      - ./nginx/bootstrap.conf.template:/etc/nginx/bootstrap.conf.template:ro
      - ./nginx/run.sh:/etc/nginx/run.sh:ro
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      backend-prod:
        restart: false
        required: true
        condition: service_started
      frontend-prod:
        restart: false
        required: true
        condition: service_started
    profiles:
      - prod

  certbot:
    container_name: certbot
    image: certbot/certbot:latest
    restart: unless-stopped
    env_file:
      - path: .env
        required: true
    entrypoint: /bin/sh
    command: ["-c", "while :; do if [ ! -s \"/etc/letsencrypt/live/$$SERVER_NAME/fullchain.pem\" ]; then certbot certonly --webroot -w /var/www/certbot -d \"$$SERVER_NAME\" --email \"$$CERTBOT_EMAIL\" --agree-tos --non-interactive && sleep 12h || sleep 300; else certbot renew --webroot -w /var/www/certbot || true; sleep 12h; fi; done"]
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    networks:
      - network
    depends_on:
      nginx-prod:
        condition: service_started
    profiles:
      - prod

  postgres:
    container_name: postgres
    image: postgres:17.5
    restart: unless-stopped
    env_file:
      - path: .env
        required: true
    environment:
      - PGUSER=${DB_USERNAME}
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - type: volume
        source: postgres-data
        target: /var/lib/postgresql/data
    networks:
      - network
    profiles:
      - prod

  postgres-dev:
    container_name: postgres-dev
    image: postgres:17.5
    restart: unless-stopped
    environment:
      POSTGRES_DB: daily_energy
      POSTGRES_USER: daily_energy
      POSTGRES_PASSWORD: daily_energy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U daily_energy -d daily_energy"]
      interval: 2s
      timeout: 3s
      retries: 15
    ports:
      - 5432:5432
    volumes:
      - type: volume
        source: postgres-dev-data
        target: /var/lib/postgresql/data
    networks:
      - network
    profiles:
      - dev
      - dev-full
  
  # Vite dev-server for local UI work. Telegram auth still requires a real Mini App session.
  frontend-full:
    container_name: frontend-full
    image: node:23-slim
    working_dir: /code
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8080}
    env_file:
      - path: .env
        required: false
    volumes:
      - ./frontend:/code
      - frontend-node-modules:/code/node_modules
    ports:
      - 5173:5173
    networks:
      - network
    profiles:
      - dev-full
  
  # Production-style frontend image (static build behind nginx). Kept for the
  # dev profile where the whole stack is built like prod.
  frontend-dev:
    build:
      context: frontend/
      dockerfile: Dockerfile
    container_name: frontend-dev
    restart: always
    env_file:
      - path: .env
        required: true
    volumes:
      - ./frontend:/code
    networks:
      - network
    depends_on:
      - backend-dev
    profiles:
      - dev-static
  
  frontend-prod:
    container_name: frontend-prod
    image: daily-energy-frontend:${TAG:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env
        required: true
    #    volumes:
    #      - ./frontend:/code
    networks:
      - network
    depends_on:
      - backend-prod
    profiles:
      - prod

networks:
  network:
    name: network
    driver: bridge

volumes:
  postgres-data:
    name: postgres-data

  postgres-dev-data:
    name: postgres-dev-data

  # Keeps `node_modules` inside the container so the mounted host tree does not
  # shadow it (avoids ABI/OS mismatches between host and container).
  frontend-node-modules:
    name: frontend-node-modules

configs:
  nginx-config-dev:
    name: nginx-config-dev
    file: ./nginx/dev.conf
